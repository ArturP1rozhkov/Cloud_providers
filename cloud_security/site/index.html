<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Security — Yandex Object Storage</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #101827;
      color: #e5e7eb;
    }

    main {
      width: min(680px, calc(100% - 48px));
      padding: 40px;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 20px 60px rgb(0 0 0 / 25%);
    }

    h1 {
      margin-top: 0;
      color: #7dd3fc;
    }

    code {
      padding: 3px 6px;
      border-radius: 5px;
      background: #0f172a;
      color: #facc15;
    }

    .ok {
      color: #86efac;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Статический сайт в Yandex Object Storage</h1>

    <p class="ok">✓ Сайт опубликован в Object Storage</p>
    <p class="ok">✓ Доступен по HTTPS</p>
    <p class="ok">✓ Сертификат выпущен через Yandex Certificate Manager</p>

    <p>
      Домен сайта:
      <code>yandex-bucket.arturpirozhkov.su</code>
    </p>

    <p>
      Практическая работа: «Безопасность в облачных провайдерах».
    </p>
  </main>
</body>
</html>
